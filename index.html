<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f0"><title>バニ平のくらし管理</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f0;color:#293a30;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;font-size:16px}main{max-width:580px;margin:auto;padding:0 16px 24px}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button,input,select{border:1px solid #d7dfd4;border-radius:11px;padding:11px;background:#fff;color:inherit}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,summary:focus-visible,select:focus-visible{outline:3px solid #6b9d80;outline-offset:2px}input{min-width:0;max-width:100%}button.primary{background:#376a50;color:#fff;border-color:#376a50}h1{font-size:14px;margin:0;color:#65806c;font-weight:500}h2{font-size:18px;margin:0 0 12px}.host{position:sticky;top:0;z-index:10;background:#f6f7f0f5;backdrop-filter:blur(12px);border-bottom:1px solid #dce5d7;padding:10px 0 8px;display:grid;grid-template-columns:90px minmax(0,1fr);gap:12px;align-items:center;min-height:145px}.portrait{border:0;background:transparent;padding:0;display:flex;align-items:center;flex-direction:column;font-size:11px;color:#65806c}.portrait img{width:85px;height:112px;object-fit:contain;transform-origin:50% 90%}.speech{margin-top:8px;background:white;border:1px solid #dce5d7;border-radius:15px 15px 15px 3px;padding:11px 13px}#host-message{font-size:14px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;max-height:88px;overflow:auto;margin:0}.tabs{display:flex;gap:8px;margin:16px 0}.tabs button{flex:1;background:transparent}.tabs button.active{background:#376a50;color:white;border-color:#376a50}.card{background:white;border:1px solid #e1e7dc;border-radius:16px;padding:14px;margin-bottom:14px}.list-head{display:flex;justify-content:space-between;align-items:center;gap:8px}#count{font-size:13px;color:#6d7d6d;margin:0}.tools summary{font-size:13px;color:#617361;cursor:pointer;padding:8px}.tools-panel{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0}.tools button{font-size:13px;padding:9px}.danger{color:#ad4040}#items{list-style:none;margin:4px 0 14px;padding:0}.item{border-bottom:1px solid #edf0e9;padding:10px 0}.item-row{display:flex;align-items:center;gap:9px}.item-row input[type=checkbox]{appearance:auto;flex:0 0 23px;width:23px;height:23px;accent-color:#376a50}.item-copy{flex:1;min-width:0;overflow-wrap:anywhere}.item-name{display:block;line-height:1.5}.done .item-name{text-decoration:line-through;color:#8b9589}.due{display:block;font-size:12px;color:#687d69;margin-top:3px}.due.overdue{color:#a34737}.mini{padding:7px 10px;font-size:13px;min-height:38px}.order{display:flex;gap:3px}.edit-form{display:flex;flex-direction:column;gap:8px;padding:10px 0}.edit-actions{display:flex;gap:6px}.edit-actions button{flex:1}.add-row{display:flex;gap:8px}.add-row input{flex:1;width:100%}#due-wrap{display:block;font-size:12px;color:#647962;margin-top:9px}#due-wrap input{display:block;margin-top:5px;width:100%}[hidden]{display:none!important}#status{font-size:13px;line-height:1.6;color:#536d55;margin:10px 0 0}#undo{margin-top:8px;font-size:13px}.empty{font-size:14px;color:#81917d;padding:20px 0;text-align:center}.chat-form{display:flex;gap:8px}.chat-form input{flex:1;width:100%}.history summary{font-size:13px;color:#667b68;cursor:pointer;margin-top:12px}#chatlog{max-height:240px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-top:10px}.bubble{font-size:14px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;padding:10px 12px;background:#f0f4eb;border-radius:12px;margin:0;max-width:90%}.bubble.user{background:#e5f0e7;align-self:flex-end}.bubble small{display:block;color:#7a8974;font-size:10px}.help{font-size:12px;color:#7b8978;line-height:1.6;margin:12px 0 0}.examples{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.examples button{font-size:12px;padding:7px 9px}.looks summary{font-size:12px;color:#768b76;cursor:pointer}.looks{margin-top:8px}.look-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}.look-grid button{padding:5px;font-size:10px}.look-grid img{width:100%;height:60px;object-fit:contain}.look-grid button[aria-pressed=true]{border-color:#376a50;background:#edf5e7}.bottom-note{text-align:center;font-size:11px;color:#83917c;margin-top:16px}@keyframes talk{25%{transform:rotate(-4deg) translateY(-3px)}65%{transform:rotate(3deg)}}.speaking{animation:talk .6s ease-in-out 3}@media(prefers-reduced-motion:reduce){.speaking{animation:none}}@media(max-width:360px){main{padding:0 10px 20px}.host{grid-template-columns:75px minmax(0,1fr);gap:8px}.portrait img{width:72px;height:102px}.card{padding:12px}.mini{padding:7px}.look-grid{grid-template-columns:repeat(5,1fr)}}
</style></head><body><main>
<header class="host"><button class="portrait" id="change-look" type="button" aria-label="バニ平の表情を変える"><img id="host-image" src="banihei-illustration.png" alt="案内役のバニ平" width="85" height="112"><span id="look-name">バニ平</span></button><div><h1>バニ平のくらし管理</h1><div class="speech"><p id="host-message" aria-live="polite">おかえりバニ！何をお手伝いするバニ？</p></div></div></header>
<nav class="tabs" aria-label="リストを選ぶ"><button id="shopping" type="button" class="active" aria-pressed="true">買うもの</button><button id="todo" type="button" aria-pressed="false">ToDo</button></nav>
<section class="card" aria-labelledby="heading"><div class="list-head"><h2 id="heading">買うもの</h2><p id="count"></p></div><details class="tools"><summary>リストの操作</summary><div class="tools-panel"><button type="button" id="reorder" aria-pressed="false">並べ替え</button><button type="button" id="clear-done">完了分を一括削除</button><button type="button" id="clear-all" class="danger">すべて一括削除</button></div></details><ul id="items"></ul><form id="form"><div class="add-row"><input id="entry" aria-label="追加する項目" placeholder="買うものを入力" maxlength="300" required><button class="primary" id="add" type="submit">追加</button></div><label id="due-wrap" hidden>日時（任意）<input type="datetime-local" id="due" aria-label="ToDoの日時（任意）"></label></form><p id="status" role="status"></p><button id="undo" type="button" hidden>削除を取り消す</button></section>
<section class="card" aria-label="バニ平とおはなし"><div class="examples"><button type="button" data-example="買うものは何が残ってる？">買うものを確認</button><button type="button" data-example="ToDoは何が残ってる？">ToDoを確認</button></div><form id="chat-form" class="chat-form"><input id="chat-input" aria-label="バニ平へのメッセージ" placeholder="バニ平に話しかける" maxlength="1000" required><button class="primary" type="submit">送信</button></form><details class="history"><summary>これまでのおはなし</summary><div id="chatlog" role="log" aria-live="polite" aria-label="バニ平との会話"></div></details><p id="chat-status" role="status"></p><details class="looks"><summary>バニ平の表情を選ぶ</summary><div id="look-grid" class="look-grid"></div><p class="help">バニ平をタップしても切り替えられるバニ。</p></details><details class="history"><summary>使い方</summary><p class="help">「牛乳と卵を買うものに追加して」で登録できるバニ。項目の「編集」で文字や日時を変更、「リストの操作」で並べ替え・一括削除ができるバニ。無料の試作版のため自由な会話は練習中バニ。</p></details></section><p class="bottom-note">リストと会話はこの端末・ブラウザに保存されます</p></main>
<script>
(function(){'use strict';
var key='bani-kurashi-test-v2',chatKey='bani-kurashi-chat-v1',undoKey='bani-kurashi-delete-undo-v1',type='shopping',data=[],history=[],editing=null,reordering=false,speechTimer,lookIndex=0;
var el=function(id){return document.getElementById(id)};
var deletionBackup=null,storageReadable=true,lastSaved='[]';try{var raw=localStorage.getItem(key);if(raw){var parsed=JSON.parse(raw);if(!Array.isArray(parsed))throw Error('invalid');data=parsed;lastSaved=raw}}catch(e){storageReadable=false;el('status').textContent='以前のリストを読み込めないバニ。保存設定を確認してほしいバニ。';el('add').disabled=true}
var looks=[['いつもの','banihei-illustration.png'],['うれしい','banihei-happy.png'],['考え中','banihei-think.png'],['聞いてる','banihei-listen.png'],['応援','banihei-cheer.png'],['ありがとう','banihei-thanks.png'],['びっくり','banihei-surprise.png'],['ひと休み','banihei-rest.png'],['メモする','banihei-note.png'],['またね','banihei-bye.png']];
try{var savedLook=Number(localStorage.getItem('bani-kurashi-look-v1'));if(Number.isInteger(savedLook)&&savedLook>=0&&savedLook<looks.length)lookIndex=savedLook}catch(e){}
function setLook(i){lookIndex=i;el('host-image').src=looks[i][1];el('look-name').textContent=looks[i][0];document.querySelectorAll('[data-look]').forEach(function(b){b.setAttribute('aria-pressed',Number(b.dataset.look)===i?'true':'false')});try{localStorage.setItem('bani-kurashi-look-v1',String(i))}catch(e){}}
looks.forEach(function(look,i){var b=document.createElement('button'),img=document.createElement('img'),label=document.createElement('span');b.type='button';b.dataset.look=String(i);b.setAttribute('aria-label',look[0]+'のバニ平');img.src=look[1];img.alt='';img.loading='lazy';label.textContent=look[0];b.append(img,label);b.addEventListener('click',function(){setLook(i)});el('look-grid').appendChild(b)});setLook(lookIndex);el('change-look').addEventListener('click',function(){setLook((lookIndex+1)%looks.length)});
function status(t){el('status').textContent=t}
function save(){if(!storageReadable){data=JSON.parse(lastSaved);status('以前のリストを保護するため、保存を止めているバニ。');return false}try{localStorage.setItem(key,JSON.stringify(data));lastSaved=JSON.stringify(data);return true}catch(e){data=JSON.parse(lastSaved);status('保存できなかったため変更を戻したバニ。空き容量や保存設定を確認してほしいバニ。');return false}}
function speak(text){el('host-message').textContent=text;el('host-image').classList.remove('speaking');void el('host-image').offsetWidth;el('host-image').classList.add('speaking');clearTimeout(speechTimer);speechTimer=setTimeout(function(){el('host-image').classList.remove('speaking')},1800)}
function button(text,label,fn){var b=document.createElement('button');b.type='button';b.className='mini';b.textContent=text;b.setAttribute('aria-label',label);b.addEventListener('click',fn);return b}
function dueLabel(value){var d=new Date(value);return isNaN(d.getTime())?value:d.toLocaleString('ja-JP',{month:'numeric',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit'})}
function move(id,dir){var indexes=[];data.forEach(function(x,i){if(x.type===type)indexes.push(i)});var at=indexes.findIndex(function(i){return data[i].id===id});if(at<0||at+dir<0||at+dir>=indexes.length)return;var a=indexes[at],b=indexes[at+dir],tmp=data[a];data[a]=data[b];data[b]=tmp;if(save())status('順番を変えたバニ。');render()}
function removeIds(ids){if(!ids.length)return;var old=data.slice();data=data.filter(function(x){return !ids.includes(x.id)});if(save()){deletionBackup={items:old,removed:ids};try{localStorage.setItem(undoKey,JSON.stringify(deletionBackup))}catch(e){}el('undo').hidden=false;status(ids.length+'件を削除したバニ。取り消しもできるバニ。');speak(ids.length+'件を削除したバニ。')}render()}
function render(){var list=el('items');list.textContent='';var visible=data.filter(function(x){return x.type===type});el('heading').textContent=type==='shopping'?'買うもの':'ToDo';el('count').textContent='残り '+visible.filter(function(x){return !x.done}).length+' / '+visible.length+'件';el('due-wrap').hidden=type!=='todo';el('entry').placeholder=type==='shopping'?'買うものを入力':'やることを入力';el('clear-done').disabled=!visible.some(function(x){return x.done});el('clear-all').disabled=!visible.length;el('reorder').disabled=visible.length<2;el('reorder').textContent=reordering?'並べ替えを終了':'並べ替え';el('reorder').setAttribute('aria-pressed',reordering?'true':'false');if(!visible.length){var empty=document.createElement('li');empty.className='empty';empty.textContent='まだ項目はないバニ。';list.appendChild(empty)}
visible.forEach(function(x,index){var li=document.createElement('li'),row=document.createElement('div'),check=document.createElement('input'),copy=document.createElement('div'),name=document.createElement('span');li.className='item'+(x.done?' done':'');row.className='item-row';check.type='checkbox';check.checked=!!x.done;check.setAttribute('aria-label',x.name+'を完了');check.addEventListener('change',function(){x.done=check.checked;if(save())status(x.done?'完了にしたバニ！':'未完了に戻したバニ！');render()});copy.className='item-copy';name.className='item-name';name.textContent=x.name;copy.appendChild(name);if(x.type==='todo'&&x.due){var due=document.createElement('time');due.className='due'+(!x.done&&new Date(x.due)<new Date()?' overdue':'');due.dateTime=x.due;due.textContent=dueLabel(x.due);copy.appendChild(due)}row.append(check,copy);if(reordering){var order=document.createElement('div');order.className='order';var up=button('↑',x.name+'を上へ',function(){move(x.id,-1)}),down=button('↓',x.name+'を下へ',function(){move(x.id,1)});up.disabled=index===0;down.disabled=index===visible.length-1;order.append(up,down);row.appendChild(order)}row.appendChild(button('編集',x.name+'を編集',function(){editing=editing===x.id?null:x.id;render()}));li.appendChild(row);
if(editing===x.id){var form=document.createElement('form'),input=document.createElement('input');form.className='edit-form';input.value=x.name;input.required=true;input.maxLength=300;input.setAttribute('aria-label','項目名を編集');form.appendChild(input);var date;if(x.type==='todo'){var label=document.createElement('label');label.textContent='日時（任意）';date=document.createElement('input');date.type='datetime-local';date.value=x.due||'';date.setAttribute('aria-label','日時を編集（任意）');label.appendChild(date);form.appendChild(label)}var actions=document.createElement('div');actions.className='edit-actions';var done=document.createElement('button');done.type='submit';done.className='primary';done.textContent='保存';actions.append(done,button('閉じる','編集を閉じる',function(){editing=null;render()}),button('削除',x.name+'を削除',function(){editing=null;removeIds([x.id])}));form.appendChild(actions);form.addEventListener('submit',function(e){e.preventDefault();var value=input.value.trim();if(!value)return; x.name=value;if(date)x.due=date.value;if(save()){editing=null;status('変更したバニ。')}render()});li.appendChild(form)}list.appendChild(li)})}
function select(t){type=t;editing=null;el('shopping').classList.toggle('active',t==='shopping');el('todo').classList.toggle('active',t==='todo');el('shopping').setAttribute('aria-pressed',t==='shopping'?'true':'false');el('todo').setAttribute('aria-pressed',t==='todo'?'true':'false');render()}
el('shopping').addEventListener('click',function(){select('shopping')});el('todo').addEventListener('click',function(){select('todo')});el('reorder').addEventListener('click',function(){reordering=!reordering;render()});el('clear-done').addEventListener('click',function(){removeIds(data.filter(function(x){return x.type===type&&x.done}).map(function(x){return x.id}))});el('clear-all').addEventListener('click',function(){removeIds(data.filter(function(x){return x.type===type}).map(function(x){return x.id}))});
try{el('undo').hidden=!localStorage.getItem(undoKey)}catch(e){}
el('undo').addEventListener('click',function(){try{var backup=deletionBackup||JSON.parse(localStorage.getItem(undoKey)||'null');if(!backup||!Array.isArray(backup.items)||!Array.isArray(backup.removed))return;backup.items.forEach(function(x,i){if(backup.removed.includes(x.id)&&!data.some(function(y){return y.id===x.id}))data.splice(Math.min(i,data.length),0,x)});if(save()){deletionBackup=null;try{localStorage.removeItem(undoKey)}catch(e){}el('undo').hidden=true;status('削除を取り消したバニ。')}render()}catch(e){status('取り消しデータを読み込めなかったバニ。')}});
el('form').addEventListener('submit',function(e){e.preventDefault();var name=el('entry').value.trim();if(!name)return;data.push({id:Date.now()+'-'+Math.random(),type:type,name:name,done:false,due:type==='todo'?el('due').value:''});if(save()){el('entry').value='';el('due').value='';status('「'+name+'」を追加したバニ！');speak('「'+name+'」を追加したバニ！')}render()});
try{var oldChat=JSON.parse(localStorage.getItem(chatKey)||'[]');if(Array.isArray(oldChat))history=oldChat.filter(function(x){return x&&typeof x.text==='string'&&(x.role==='user'||x.role==='bani')})}catch(e){el('chat-status').textContent='以前の会話を読み込めなかったバニ。'}
function renderChat(){var log=el('chatlog');log.textContent='';history.forEach(function(m){var box=document.createElement('p'),label=document.createElement('small');box.className='bubble '+m.role;label.textContent=m.role==='user'?'あなた':'バニ平';box.append(label,document.createTextNode(m.text));log.appendChild(box)});log.scrollTop=log.scrollHeight}
function remember(role,text){history.push({role:role,text:text,at:Date.now()});try{localStorage.setItem(chatKey,JSON.stringify(history))}catch(e){el('chat-status').textContent='会話を保存できなかったバニ。空き容量を確認してほしいバニ。'}renderChat();if(role==='bani')speak(text)}
function remaining(t){var names=data.filter(function(x){return x.type===t&&!x.done}).map(function(x){return x.name+(x.due?'（'+dueLabel(x.due)+'）':'')});var title=t==='shopping'?'買うもの':'ToDo';return names.length?title+'はあと'+names.length+'件バニ！\n・'+names.join('\n・'):title+'の残りはないバニ！ひと息つけるバニ。'}
function respond(raw){
 var text=raw.normalize('NFKC').trim(),target=/買うもの|買い物|買物|ショッピング/.test(text)?'shopping':/todo|やること|やる事|タスク/i.test(text)?'todo':null;
 var add=/追加|登録|入れて|いれて|メモして/.test(text);
 if(add){
  if(/追加しない|登録しない|追加しなく|登録しなく|入れない|いれない/.test(text))return '今回は追加しないバニ。必要になったら声をかけてほしいバニ。';
  if(!target)return '買うものとToDo、どちらに追加するバニ？「牛乳を買うものに追加して」のように教えてほしいバニ。';
  var names=text.replace(/^(?:ねえ[、, ]*|バニ平[、, !！]*)/,'').replace(/(?:買うもの|買い物|買物|ショッピング|todo|やること|やる事|タスク)(?:のリスト|リスト)?(?:に|へ|を|は)?/ig,'').replace(/(?:追加|登録)(?:して(?:おいて|ください|ほしい)?|お願い|する)?|入れて(?:おいて|ください)?|いれて|メモして/g,'').replace(/^[、,\s]+|[をにはへ、,\s。!！?？]+$/g,'').split(/[、,\n]+|と|および/).map(function(n){return n.trim()}).filter(Boolean);
  if(!names.length)return '何を追加するバニ？「牛乳と卵を買うものに追加して」のように教えてほしいバニ。';
  var added=[],duplicate=[];names.forEach(function(n){if(data.some(function(x){return x.type===target&&!x.done&&x.name===n}))duplicate.push(n);else{data.push({id:Date.now()+'-'+Math.random(),type:target,name:n,done:false});added.push(n)}});
  var persisted=save();select(target);if(!persisted)return '保存できなかったので追加を取り消したバニ。空き容量や保存設定を確認してほしいバニ。';
  return (added.length?'「'+added.join('、')+'」を'+(target==='shopping'?'買うもの':'ToDo')+'に追加したバニ！':'')+(duplicate.length?'「'+duplicate.join('、')+'」はすでに未完了のリストにあるバニ。':'')+(persisted?'':'\n端末への保存はできなかったバニ。画面を閉じると消える可能性があるバニ。');
 }
 if(/削除|消して|完了に|買った|終わった/.test(text))return '間違いを防ぐため、完了や削除はリストのチェック欄・削除ボタンで操作してほしいバニ。';
 if(target&&/何|なに|残|確認|教え|見せ|一覧|ある|リスト/.test(text))return remaining(target);
 if(/何が残|残り|未完了/.test(text))return remaining('shopping')+'\n\n'+remaining('todo');
 if(/おはよう/.test(text))return 'おはようバニ！今日の買い物や、やることを一緒に整理するバニ。';
 if(/こんにちは|こんばんは|やっほ/.test(text))return '会えてうれしいバニ！今日はどんな一日だったバニ？';
 if(/ありがと/.test(text))return '役に立ててうれしいバニ！またいつでも声をかけてほしいバニ。';
 if(/疲れ|つかれ|しんど|つらい/.test(text))return '今日もおつかれさまバニ。まずはひと息ついてほしいバニ。やることをリストに出して、少しずつ片づけるバニ。';
 if(/おやすみ/.test(text))return '今日も一日おつかれさまバニ。ゆっくり休むバニ。';
 if(/元気/.test(text))return '元気バニ！くらしを手伝えるのがうれしいバニ。';
 if(/できる|使い方|ヘルプ/.test(text))return '「牛乳と卵を買うものに追加して」「掃除をToDoに追加して」「買うものは何が残ってる？」と話しかけてほしいバニ。簡単なあいさつにも返事するバニ。';
 return '話してくれてありがとうバニ。まだ自由な会話は練習中バニ。「牛乳を買うものに追加して」や「ToDoは何が残ってる？」なら手伝えるバニ。';
}
el('chat-form').addEventListener('submit',function(e){e.preventDefault();var input=el('chat-input'),text=input.value.trim();if(!text)return;remember('user',text);input.value='';remember('bani',respond(text))});document.querySelectorAll('[data-example]').forEach(function(b){b.addEventListener('click',function(){el('chat-input').value=b.dataset.example;el('chat-input').focus()})});if(!history.length)remember('bani','おかえりバニ！買い物もToDoも、お手伝いするバニ。');else{renderChat();var last=history.slice().reverse().find(function(m){return m.role==='bani'});if(last)el('host-message').textContent=last.text}render();
})();
</script></body></html>
