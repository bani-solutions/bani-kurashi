<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>バニ平のくらし管理</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;background:#f8f6f0;color:#292821;margin:0;padding:18px}main{max-width:540px;margin:auto}h1{font-size:24px}section{background:white;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 2px 9px #0001}button,input{font:inherit;padding:12px;border-radius:10px;border:1px solid #aaa}button{background:#e9e4d7;cursor:pointer}button:active{transform:scale(.97)}.tabs{display:flex;gap:8px}.tabs button{flex:1}.tabs .active{background:#366c52;color:white;border-color:#366c52}#add{background:#366c52;color:white}form{display:flex;gap:8px}input{min-width:0;flex:1}li{padding:10px 0;border-bottom:1px solid #eee;display:flex;align-items:center;gap:10px}li span{flex:1}li.done span{text-decoration:line-through;color:#777}.note{color:#555;font-size:14px}#status{font-weight:600;color:#235c43}#items{list-style:none;padding:0}#chatlog{max-height:380px;overflow:auto;padding:4px;display:flex;flex-direction:column;gap:10px;margin:12px 0}.bubble{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px 14px;border-radius:14px;background:#f0f3eb;max-width:85%;margin:0}.bubble.user{align-self:flex-end;background:#e0eee5}.bubble small{display:block;font-size:12px;color:#555;margin-bottom:4px}.examples{display:flex;flex-wrap:wrap;gap:6px}.examples button{font-size:13px;padding:8px}button:focus-visible,input:focus-visible{outline:3px solid #50896b;outline-offset:2px}#chat-status{color:#9b3025}h2{font-size:19px}#chat-send{background:#366c52;color:white}
body{background:#f3f4ec}h1{font-size:23px}.conversation{background:linear-gradient(155deg,#fffef8,#f0f7ef);border:1px solid #dce8d9}.host-label{font-size:12px;letter-spacing:.08em;color:#4b7561;display:flex;align-items:center;gap:6px}.online-dot{width:7px;height:7px;border-radius:50%;background:#6c9c64}.conversation h2{font-size:23px;margin:9px 0 4px}.host-stage{display:grid;grid-template-columns:40% minmax(0,1fr);align-items:center;gap:14px;min-height:235px;margin:12px -4px 20px}.host-portrait{position:relative;text-align:center;align-self:end;background:radial-gradient(ellipse at 50% 75%,#dce8c8 0%,transparent 68%);padding-bottom:25px}.host-portrait img{width:100%;height:230px;object-fit:contain;filter:drop-shadow(0 7px 6px #36523a16);transform-origin:50% 95%}.host-name{position:absolute;bottom:0;left:50%;transform:translateX(-50%);font-size:12px;background:#fff9;border:1px solid #dbe5d5;padding:4px 14px;border-radius:20px;white-space:nowrap}.host-speech{background:#fff;border:1px solid #d5e4d5;border-radius:20px 20px 20px 5px;position:relative;padding:17px 15px;box-shadow:0 5px 16px #36523a09}.host-speech:before{content:'';position:absolute;left:-9px;top:40%;width:16px;height:16px;background:white;border-left:1px solid #d5e4d5;border-bottom:1px solid #d5e4d5;transform:rotate(45deg)}.speech-label{font-size:11px;color:#67816a}.host-speech p{font-size:16px;line-height:1.85;margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow:auto}.chat-history{border-top:1px solid #dce5d9;margin:12px 0;padding-top:12px}.chat-history summary{font-size:13px;color:#5f705e;cursor:pointer}#chatlog{max-height:240px}#chat-form{margin-top:12px}#chat-input{background:#fff}#chat-send{white-space:nowrap}@keyframes host-speak{0%,100%{transform:rotate(0) translateY(0)}25%{transform:rotate(-3deg) translateY(-4px)}65%{transform:rotate(2deg) translateY(-2px)}}.speaking{animation:host-speak .6s ease-in-out 3}@media(prefers-reduced-motion:reduce){.speaking{animation:none}}@media(max-width:360px){body{padding:12px}.host-stage{gap:10px;grid-template-columns:38% minmax(0,1fr)}.host-portrait img{height:200px}.host-speech{padding:12px}.host-speech p{font-size:15px}}
</style></head><body><main><h1>🐰 バニ平のくらし管理</h1><p>「買うものも、やることも任せるバニ！」</p><section><div class="tabs"><button id="shopping" class="active" type="button">🛒 買うもの</button><button id="todo" type="button">☑️ ToDo</button></div><h2 id="heading">買うもの</h2><p id="count">0件</p><ul id="items"></ul><form id="form"><input id="entry" aria-label="追加する項目" placeholder="例：牛乳" required><button id="add" type="submit">追加</button></form><p id="status" role="status">起動確認中…</p></section><section class="conversation" aria-labelledby="chat-heading"><div class="host-label"><span class="online-dot"></span>くらしの案内役</div><h2 id="chat-heading">バニ平とおはなし</h2><div class="host-stage"><div class="host-portrait"><img id="host-image" src="banihei-host.png" alt="水色の毛並みと黄緑のお腹のバニ平" width="180" height="230"><span class="host-name">バニ平</span></div><div class="host-speech"><span class="speech-label">バニ平より</span><p id="host-message">おかえりバニ！今日は何をお手伝いするバニ？</p></div></div><p class="note">無料の会話試作版です。決まった言い方を手がかりに返事します。買い物・ToDoの追加や確認ができます。会話とリストはこの端末・ブラウザ内に保存されます。夫婦間の同期は未対応です。</p><details class="chat-history" open><summary>これまでのおはなし</summary><div id="chatlog" role="log" aria-live="polite" aria-label="バニ平との会話"></div></details><div class="examples"><button type="button" data-example="牛乳と卵を買うものに追加して">牛乳と卵を追加</button><button type="button" data-example="買うものは何が残ってる？">買うものを確認</button><button type="button" data-example="ToDoは何が残ってる？">ToDoを確認</button></div><form id="chat-form"><input id="chat-input" aria-label="バニ平へのメッセージ" placeholder="バニ平に話しかける" maxlength="1000" required><button id="chat-send" type="submit">送信</button></form><p id="chat-status" role="status"></p><p id="reply" class="note">キーボードのマイクからも入力できるバニ！</p></section></main><script>(function(){'use strict';var key='bani-kurashi-test-v2',type='shopping',data=[];var el=function(id){return document.getElementById(id)};try{var saved=localStorage.getItem(key);if(saved){var parsed=JSON.parse(saved);if(Array.isArray(parsed))data=parsed}}catch(e){el('status').textContent='保存機能が使えません。追加は試せます。'}function save(){try{localStorage.setItem(key,JSON.stringify(data));return true}catch(e){el('status').textContent='変更を保存できなかったバニ。保存設定を確認してほしいバニ。';return false}}function render(){var list=el('items');list.textContent='';var visible=data.filter(function(x){return x.type===type});el('heading').textContent=type==='shopping'?'買うもの':'ToDo';el('count').textContent='全'+visible.length+'件 / 未完了'+visible.filter(function(x){return !x.done}).length+'件';visible.forEach(function(x){var li=document.createElement('li'),check=document.createElement('input'),span=document.createElement('span'),del=document.createElement('button');check.type='checkbox';check.checked=!!x.done;check.addEventListener('change',function(){x.done=check.checked;save();render();el('status').textContent=x.done?'完了にしたバニ！':'未完了に戻したバニ！'});span.textContent=x.name;del.type='button';del.textContent='削除';del.addEventListener('click',function(){data=data.filter(function(a){return a.id!==x.id});save();render();el('status').textContent='削除したバニ！'});li.className=x.done?'done':'';li.append(check,span,del);list.appendChild(li)})}function select(t){type=t;el('shopping').classList.toggle('active',t==='shopping');el('todo').classList.toggle('active',t==='todo');render();el('status').textContent=(t==='shopping'?'買うもの':'ToDo')+'を表示中バニ！'}el('shopping').addEventListener('click',function(){select('shopping')});el('todo').addEventListener('click',function(){select('todo')});el('form').addEventListener('submit',function(e){e.preventDefault();var name=el('entry').value.trim();if(!name)return;data.push({id:Date.now()+'-'+Math.random(),type:type,name:name,done:false});save();render();el('entry').value='';el('status').textContent='「'+name+'」を追加したバニ！';el('reply').textContent='「'+name+'」をリストに追加したバニ！'});
var chatKey='bani-kurashi-chat-v1',history=[];
try{var oldChat=JSON.parse(localStorage.getItem(chatKey)||'[]');if(Array.isArray(oldChat))history=oldChat.filter(function(x){return x&&typeof x.text==='string'&&(x.role==='user'||x.role==='bani')})}catch(e){el('chat-status').textContent='会話履歴を読み込めなかったバニ。保存設定を確認してほしいバニ。'}
function renderChat(){var log=el('chatlog');log.textContent='';history.forEach(function(m){var box=document.createElement('p'),label=document.createElement('small');box.className='bubble '+m.role;label.textContent=m.role==='user'?'あなた':'バニ平';box.appendChild(label);box.appendChild(document.createTextNode(m.text));log.appendChild(box)});log.scrollTop=log.scrollHeight;var last=history.slice().reverse().find(function(m){return m.role==='bani'});if(last)el('host-message').textContent=last.text}
var speechTimer;function remember(role,text){if(role==='bani'){el('host-image').classList.remove('speaking');void el('host-image').offsetWidth;el('host-image').classList.add('speaking');clearTimeout(speechTimer);speechTimer=setTimeout(function(){el('host-image').classList.remove('speaking')},1800)}history.push({role:role,text:text,at:Date.now()});try{localStorage.setItem(chatKey,JSON.stringify(history))}catch(e){el('chat-status').textContent='会話を保存できなかったバニ。ブラウザの空き容量や保存設定を確認してほしいバニ。'}renderChat()}
function remaining(t){var names=data.filter(function(x){return x.type===t&&!x.done}).map(function(x){return x.name});var title=t==='shopping'?'買うもの':'ToDo';return names.length?title+'はあと'+names.length+'件バニ！\n・'+names.join('\n・'):title+'の残りはないバニ！ひと息つけるバニ。'}
function respond(raw){
 var text=raw.normalize('NFKC').trim(),target=/買うもの|買い物|買物|ショッピング/.test(text)?'shopping':/todo|やること|やる事|タスク/i.test(text)?'todo':null;
 var add=/追加|登録|入れて|いれて|メモして/.test(text);
 if(add){
  if(/追加しない|登録しない|追加しなく|登録しなく|入れない|いれない/.test(text))return '今回は追加しないバニ。必要になったら声をかけてほしいバニ。';
  if(!target)return '買うものとToDo、どちらに追加するバニ？「牛乳を買うものに追加して」のように教えてほしいバニ。';
  var names=text.replace(/^(?:ねえ[、, ]*|バニ平[、, !！]*)/,'').replace(/(?:買うもの|買い物|買物|ショッピング|todo|やること|やる事|タスク)(?:のリスト|リスト)?(?:に|へ|を|は)?/ig,'').replace(/(?:追加|登録)(?:して(?:おいて|ください|ほしい)?|お願い|する)?|入れて(?:おいて|ください)?|いれて|メモして/g,'').replace(/^[、,\s]+|[をにはへ、,\s。!！?？]+$/g,'').split(/[、,\n]+|と|および/).map(function(n){return n.trim()}).filter(Boolean);
  if(!names.length)return '何を追加するバニ？「牛乳と卵を買うものに追加して」のように教えてほしいバニ。';
  var added=[],duplicate=[];names.forEach(function(n){if(data.some(function(x){return x.type===target&&!x.done&&x.name===n}))duplicate.push(n);else{data.push({id:Date.now()+'-'+Math.random(),type:target,name:n,done:false});added.push(n)}});
  var persisted=save();select(target);
  return (added.length?'「'+added.join('、')+'」を'+(target==='shopping'?'買うもの':'ToDo')+'に追加したバニ！':'')+(duplicate.length?'「'+duplicate.join('、')+'」はすでに未完了のリストにあるバニ。':'')+(persisted?'':'\n端末への保存はできなかったバニ。画面を閉じると消える可能性があるバニ。');
 }
 if(/削除|消して|完了に|買った|終わった/.test(text))return '間違いを防ぐため、完了や削除はリストのチェック欄・削除ボタンで操作してほしいバニ。';
 if(target&&/何|なに|残|確認|教え|見せ|一覧|ある|リスト/.test(text))return remaining(target);
 if(/何が残|残り|未完了/.test(text))return remaining('shopping')+'\n\n'+remaining('todo');
 if(/おはよう/.test(text))return 'おはようバニ！今日の買い物や、やることを一緒に整理するバニ。';
 if(/こんにちは|こんばんは|やっほ/.test(text))return '会えてうれしいバニ！今日はどんな一日だったバニ？';
 if(/ありがと/.test(text))return '役に立ててうれしいバニ！またいつでも声をかけてほしいバニ。';
 if(/疲れ|つかれ|しんど|つらい/.test(text))return '今日もおつかれさまバニ。まずはひと息ついてほしいバニ。やることをリストに出して、少しずつ片づけるバニ。';
 if(/おやすみ/.test(text))return '今日も一日おつかれさまバニ。ゆっくり休むバニ。';
 if(/元気/.test(text))return '元気バニ！くらしを手伝えるのがうれしいバニ。';
 if(/できる|使い方|ヘルプ/.test(text))return '「牛乳と卵を買うものに追加して」「掃除をToDoに追加して」「買うものは何が残ってる？」と話しかけてほしいバニ。簡単なあいさつにも返事するバニ。';
 return '話してくれてありがとうバニ。まだ自由な会話は練習中バニ。「牛乳を買うものに追加して」や「ToDoは何が残ってる？」なら手伝えるバニ。';
}
el('chat-form').addEventListener('submit',function(e){e.preventDefault();var input=el('chat-input'),text=input.value.trim();if(!text)return;remember('user',text);input.value='';remember('bani',respond(text));});
document.querySelectorAll('[data-example]').forEach(function(b){b.addEventListener('click',function(){el('chat-input').value=b.dataset.example;el('chat-input').focus()})});
if(!history.length)remember('bani','こんにちは、バニ平バニ！買うものやToDoの追加・確認をお手伝いするバニ。');else renderChat();

render();el('status').textContent='✅ 操作機能が起動したバニ！';})();</script></body></html>
