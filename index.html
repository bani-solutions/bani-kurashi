<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>バニ平のくらし管理</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;background:#f8f6f0;color:#292821;margin:0;padding:18px}main{max-width:540px;margin:auto}h1{font-size:24px}section{background:white;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 2px 9px #0001}button,input{font:inherit;padding:12px;border-radius:10px;border:1px solid #aaa}button{background:#e9e4d7;cursor:pointer}button:active{transform:scale(.97)}.tabs{display:flex;gap:8px}.tabs button{flex:1}.tabs .active{background:#366c52;color:white;border-color:#366c52}#add{background:#366c52;color:white}form{display:flex;gap:8px}input{min-width:0;flex:1}li{padding:10px 0;border-bottom:1px solid #eee;display:flex;align-items:center;gap:10px}li span{flex:1}li.done span{text-decoration:line-through;color:#777}.note{color:#555;font-size:14px}#status{font-weight:600;color:#235c43}#items{list-style:none;padding:0}</style></head>
<body><main><h1>🐰 バニ平のくらし管理</h1><p>「買うものも、やることも任せるバニ！」</p><section><div class="tabs"><button id="shopping" class="active" type="button">🛒 買うもの</button><button id="todo" type="button">☑️ ToDo</button></div><h2 id="heading">買うもの</h2><p id="count">0件</p><ul id="items"></ul><form id="form"><input id="entry" aria-label="追加する項目" placeholder="例：牛乳" required><button id="add" type="submit">追加</button></form><p id="status" role="status">起動確認中…</p></section><section><h2>バニ平から</h2><p id="reply">まずはリストに登録してみるバニ！</p><p class="note">iPhoneのキーボードのマイクで日本語を入力できます。現在は端末内保存のテスト版です。夫婦間の同期やAI会話は未対応です。</p></section></main>
<script>
(function(){
'use strict';
var key='bani-kurashi-test-v2',type='shopping',data=[];
var el=function(id){return document.getElementById(id)};
try{var saved=localStorage.getItem(key);if(saved){var parsed=JSON.parse(saved);if(Array.isArray(parsed))data=parsed}}catch(e){el('status').textContent='保存機能が使えません。追加は試せます。'}
function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch(e){el('status').textContent='追加できましたが保存に失敗しました'}}
function render(){var list=el('items');list.textContent='';var visible=data.filter(function(x){return x.type===type});el('heading').textContent=type==='shopping'?'買うもの':'ToDo';el('count').textContent='全'+visible.length+'件 / 未完了'+visible.filter(function(x){return !x.done}).length+'件';visible.forEach(function(x){var li=document.createElement('li'),check=document.createElement('input'),span=document.createElement('span'),del=document.createElement('button');check.type='checkbox';check.checked=!!x.done;check.addEventListener('change',function(){x.done=check.checked;save();render();el('status').textContent=x.done?'完了にしたバニ！':'未完了に戻したバニ！'});span.textContent=x.name;del.type='button';del.textContent='削除';del.addEventListener('click',function(){data=data.filter(function(a){return a.id!==x.id});save();render();el('status').textContent='削除したバニ！'});li.className=x.done?'done':'';li.append(check,span,del);list.appendChild(li)})}
function select(t){type=t;el('shopping').classList.toggle('active',t==='shopping');el('todo').classList.toggle('active',t==='todo');render();el('status').textContent=(t==='shopping'?'買うもの':'ToDo')+'を表示中バニ！'}
el('shopping').addEventListener('click',function(){select('shopping')});el('todo').addEventListener('click',function(){select('todo')});
el('form').addEventListener('submit',function(e){e.preventDefault();var name=el('entry').value.trim();if(!name)return;data.push({id:Date.now()+'-'+Math.random(),type:type,name:name,done:false});save();render();el('entry').value='';el('status').textContent='「'+name+'」を追加したバニ！';el('reply').textContent='「'+name+'」をリストに追加したバニ！'});
render();el('status').textContent='✅ 操作機能が起動したバニ！';
})();
</script></body></html>
